

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Golden Sunset, an Old Love Journal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .sunset-scene {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(
                to bottom,
                #ffefad 0%,
                #ffd36e 35%,
                #f7a653 65%,
                #bd694e 100%
            );
        }

        .sun {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #fff2b0;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 40px #ffe7a0,
                0 0 100px #ffd47a;
        }

        .ocean {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(
                to bottom,
                #bd765b,
                #744d50,
                #342f43
            );
        }
    </style>
</head>

<body>
    <div class="sunset-scene">
        <div class="sun"></div>
        <div class="ocean"></div>
    </div>
</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Golden Sunset, an Old Love Journal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .sunset-scene {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(
                to bottom,
                #ffefad 0%,
                #ffd36e 35%,
                #f7a653 65%,
                #bd694e 100%
            );
        }

        .sun {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #fff2b0;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 40px #ffe7a0,
                0 0 100px #ffd47a;
        }

       
.ocean {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 40%;

    background:
        linear-gradient(
            to bottom,
            rgba(255, 222, 139, 0.75) 0%,
            rgba(224, 153, 104, 0.55) 18%,
            rgba(116, 77, 80, 0.9) 55%,
            #342f43 100%
        );
}

.ocean::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 24%;
    height: 100%;

    background: linear-gradient(
        to bottom,
        rgba(255, 244, 190, 0.85),
        rgba(255, 219, 132, 0.45) 35%,
        rgba(255, 210, 120, 0.08) 100%
    );

    filter: blur(12px);
        }
        
.ocean::after {
    content: "";
    position: absolute;
    inset: 8% 0 0;

    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 13px,
        rgba(255, 222, 157, 0.22) 14px,
        transparent 16px,
        transparent 24px
    );

    opacity: 0.75;
}

/* ===== OUR LITTLE SUNSET HILLS ===== */

.hill {
    position: absolute;
    bottom: 32%;
    width: 30%;
    height: 15%;
    background: #24232b;
    border-radius: 50% 50% 0 0;
    z-index: 2;
}


.hill-left {
    left: 16%;
    width: 25%;
    transform: rotate(-4deg);
}

.hill-right {
    right: 16%;
    width: 25%;
    height: 12%;
    transform: rotate(4deg);
}


    </style>
</head>

<body>
   
<div class="sunset-scene">
    <div class="sun"></div>
    <div class="ocean"></div>

    <div class="hill hill-left"></div>
    <div class="hill hill-right"></div>
</div>
</body>
</html>
